<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>租屋訂金收據（簽署版）</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>租屋訂金收據</h2>

        <div class="section-title">一、房東預填資料（不可修改）</div>
        <label>房東 / 仲介姓名</label>
        <input type="text" id="landlordName_ro" value="王小姐" readonly> <label>聯絡電話：</label>
        <input type="tel" id="landlordPhone_ro" value="+886912345678" readonly> <label>租屋地址</label>
        <input type="text" id="leaseAddress_ro" value="台北市大安區信義路123號" readonly> <label>租期（起）</label>
        <input type="text" id="leaseStartDate_ro" value="2025/05/01" readonly> <label>租期（迄）</label>
        <input type="text" id="leaseEndDate_ro" value="2026/04/30" readonly> <label>月租金</label>
        <input type="text" id="monthlyRent_ro" value="NT$20,000" readonly> <label>訂金金額</label>
        <input type="text" id="depositAmount_ro" value="NT$10,000" readonly> <div class="button-group">
            <button type="button" onclick="shareToLine()">房東填寫完畢 ➜LINE 傳送給租客</button>
        </div>

        <form id="tenant-form">
            <h2>二、承租人填寫資訊</h2>
            <div class="form-section">
                <p>
                    <label for="tenantName">承租人姓名：</label><br>
                    <input type="text" id="tenantName" name="tenantName" required>
                </p>
                <p>
                    <label for="tenantPhone">聯絡電話：</label><br>
                    <input type="tel" id="tenantPhone" name="tenantPhone" required>
                </p>
                <p>
                    <label for="tenantEmail">電子郵件：</label><br>
                    <input type="email" id="tenantEmail" name="tenantEmail" required>
                </p>
            </div>

            <div class="terms-section">
                <h2>三、承租人條款同意確認</h2>
                <div class="clause-box">
                     <ul style="padding-left: 1.2rem; margin: 0; font-size: 0.95rem; line-height: 1.6;">
                        <li>訂金為保留租賃意願之用，一旦審核通過即成立契約預約。</li>
                        <li>若於預定簽約日前，因甲方（承租人）之事由致不能履行時，訂金不得請求返還。</li>
                        <li>若乙方同意後，因乙方之事由致不能履行時，應雙倍返還訂金。</li>
                    </ul>
                </div>
                <p style="font-size: smaller;">（請詳閱並勾選以下 4-7 項條款）</p>
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="term4-agree" name="term4-agree" required>
                        <label for="term4-agree">我了解並同意相關仲介服務費條款。</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="term5-agree" name="term5-agree" required>
                        <label for="term5-agree">我已詳閱並同意上述條款內容，並確認提供資料為真實無誤。</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="term6-agree" name="term6-agree" required>
                        <label for="term6-agree">本人了解，本訂金為租賃意願之擔保，並不代表已完成承租程序，仍需經出租人進行資料審核。</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="term7-agree" name="term7-agree" required>
                        <label for="term7-agree">我了解本收據具《民法第 249 條》所定之法律效力，並同意受其約束。</label>
                    </div>
                </div>
            </div>
            <hr>

            <h2>承租人簽名確認:</h2>
            <div class="signature-pad-container">
                <canvas id="signature-pad" style="border: 1px dashed #ccc; width: 100%; min-height: 150px; background-color: #fff;"></canvas>
                 <span class="signature-placeholder" id="signature-placeholder" style="position: absolute; top: 10px; left: 10px; color: #aaa; pointer-events: none; z-index: 1;">在此簽名</span>
            </div>

            <div class="button-group">
                <button type="button" id="clear-button">清除簽名</button>
                <button type="button" id="confirm-button">確認資料並簽名送出</button>
            </div>

            <p id="status-message" style="min-height: 1.2em; margin-top: 1em; text-align: center;"></p>
        </form>

    </div>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="signature_pad.umd.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
