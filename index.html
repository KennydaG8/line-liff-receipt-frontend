<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>租屋定金收據（簽署版）</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  </head>
<body>
  <div class="container">
    <h2>租屋定金收據</h2>

    <div class="section-title">一、出租人 / 仲介資訊 (乙方)</div>
    <div class="form-section">
      <label for="landlordName">姓名 / 單位名稱：</label>
      <input type="text" id="landlordName" name="landlordName" placeholder="請輸入出租人或仲介姓名/單位" required>

      <label for="landlordPhone">聯絡電話：</label>
      <input type="tel" id="landlordPhone" name="landlordPhone" placeholder="請輸入乙方聯絡電話" required>
    </div>

    <div class="section-title">二、承租人資訊 (甲方)</div>
    <div class="form-section">
      <label for="tenantName">姓名：</label>
      <input type="text" id="tenantName" name="tenantName" placeholder="請輸入承租人姓名" required>

      <label for="tenantPhone">聯絡電話：</label>
      <input type="tel" id="tenantPhone" name="tenantPhone" placeholder="請輸入承租人電話" required>

      <label for="tenantEmail">電子信箱：</label>
      <input type="email" id="tenantEmail" name="tenantEmail" placeholder="請輸入承租人 Email" required>
    </div>

    <div class="section-title">三、租賃與定金資訊</div>
    <div class="form-section">
      <label for="leaseAddress">租賃地址：</label>
      <input type="text" id="leaseAddress" name="leaseAddress" required>

      <label for="leaseStartDate">租期 (起)：</label>
      <input type="text" id="leaseStartDate" name="leaseStartDate" placeholder="建議格式: YYYY 年 MM 月 DD 日" required>

      <label for="leaseEndDate">租期 (迄)：</label>
      <input type="text" id="leaseEndDate" name="leaseEndDate" placeholder="建議格式: YYYY 年 MM 月 DD 日" required>

      <label for="monthlyRent">月租金 (NT$)：</label>
      <input type="number" id="monthlyRent" name="monthlyRent" inputmode="numeric" pattern="[0-9]*" required>

      <label for="rentPaymentMethod">租金繳納方式：</label>
      <input type="text" id="rentPaymentMethod" name="rentPaymentMethod" placeholder="例如: 月繳 / 匯款" required>

      <label for="depositAmount">定金金額 (NT$)：</label>
      <input type="number" id="depositAmount" name="depositAmount" inputmode="numeric" pattern="[0-9]*" required>

      <label for="depositPaymentMethod">定金付款方式：</label>
      <input type="text" id="depositPaymentMethod" name="depositPaymentMethod" placeholder="例如: 現金 / 匯款" required>

      <label for="depositPaymentDate">定金付款日期：</label>
      <input type="text" id="depositPaymentDate" name="depositPaymentDate" placeholder="建議格式: YYYY 年 MM 月 DD 日" required>

      <label for="expectedSigningDate">預定簽約日：</label>
      <input type="text" id="expectedSigningDate" name="expectedSigningDate" placeholder="建議格式: YYYY 年 MM 月 DD 日" required>

      <label for="brokerageFeeAmount">仲介服務費金額 (NT$)：</label>
      <input type="number" id="brokerageFeeAmount" name="brokerageFeeAmount" inputmode="numeric" pattern="[0-9]*" placeholder="(無則免填)">

      <label for="remarks">備註 (如有)：</label>
      <textarea id="remarks" name="remarks" rows="3"></textarea>
    </div>


    <div class="section-title">三、承租人條款同意確認</div> <div class="clause-box">
      <ul style="padding-left: 1.2rem; margin: 0; font-size: 0.95rem; line-height: 1.6;">
        <li>訂金為保留租賃意願之用，一旦審核通過即成立契約預約。</li>
        <li>若於預定簽約日前，因甲方（承租人）之事由致不能履行時，定金不得請求返還。</li>
        <li>若乙方同意後，因乙方之事由致不能履行時，應雙倍返還定金。</li>
      </ul>
    </div>
    <div class="checkbox-group">
        <label><input type="checkbox" id="term4-agree" name="term4-agree" required>我了解並同意相關仲介服務費條款。</label>
        <label><input type="checkbox" id="term5-agree" name="term5-agree" required>我已詳細閱讀並同意上述條款內容，並確認提供資料為真實無誤。</label>
        <label><input type="checkbox" id="term6-agree" name="term6-agree" required>本人了解，本訂金為租賃意願之擔保，並不代表已完成承租程序，仍需經出租人進行資料審核。</label>
        <label><input type="checkbox" id="term7-agree" name="term7-agree" required>我了解本收據具《民法第249條》所定之法律效力，並同意受其約束。</label>
    </div>

    <div class="section-title">四、承租人簽名確認</div>
    <div style="position: relative; width: 100%; max-width: 100%;" class="signature-box">
      <canvas id="signature-pad" style="width: 100%; max-width: 100%; display: block;"></canvas>
      </div>

    <div class="button-group">
      <button id="clear-button" style="background-color: #ccc; color: #333;">清除簽名</button>
      <button id="confirm-button">送出並存為 PDF 檔</button>
    </div>
    <p id="status-message" class="subtext">請填寫表單資訊並簽名確認。</p>

  </div> <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="signature_pad.umd.min.js"></script>
  <script src="script.js"></script>
  </body>
</html>
