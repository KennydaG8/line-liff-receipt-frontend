<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>訂金收據簽名</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>訂金資訊填寫與簽署</h1>

    <div id="receipt-info">
        <p>
            <label for="rep-company-name">您的公司/單位名稱 (業務填寫)：</label><br>
            <input type="text" id="rep-company-name" name="rep-company-name" required>
        </p>
        <hr> <p><strong>--- 以下由客戶填寫 ---</strong></p>
        <p>
            <label for="customer-name">姓名/聯絡人：</label><br>
            <input type="text" id="customer-name" name="customer-name" required>
        </p>
        <p>
            <label for="amount">訂金金額：</label><br>
            <input type="text" id="amount" name="amount" required>
        </p>
        <p>
            <label for="description">事由/備註：</label><br>
            <textarea id="description" name="description" rows="3" required></textarea>
        </p>
    </div>
    <hr>

    <h2>客戶簽名確認:</h2>
    <div class="signature-pad-container">
        <canvas id="signature-canvas"></canvas>
    </div>

    <div>
        <button id="clear-button">清除簽名</button>
        <button id="confirm-button">確認簽名並送出</button>
    </div>

    <p id="status-message"></p>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="signature_pad.umd.min.js"></script> <script src="script.js"></script>

</body>
</html>
